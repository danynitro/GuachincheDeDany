name: Build Guachinche de Dany APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: gdd-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: v3.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Restore configured signing key
        env:
          SIGNING_KEY: ${{ secrets.GDD_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore
      - name: Build signed debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Prepare versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GuachincheDeDany-${APP_VERSION}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guachinche-de-Dany-APK
          path: GuachincheDeDany-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
      - name: Publish update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Guachinche de Dany ${{ env.APP_VERSION }}
          body: Actualización oficial de Guachinche de Dany.
          files: GuachincheDeDany-${{ env.APP_VERSION }}.apk
          make_latest: true
